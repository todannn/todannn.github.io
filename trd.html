<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XAUUSD Prediksi Trading Realtime</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        
        /* Status Koneksi */
        .network-container {
            text-align: center;
            margin-bottom: 20px;
        }
        .network-status {
            display: inline-block;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        .online {
            background-color: rgba(46, 204, 113, 0.2);
            color: #2ecc71;
            border: 1px solid #2ecc71;
        }
        .offline {
            background-color: rgba(231, 76, 60, 0.2);
            color: #e74c3c;
            border: 1px solid #e74c3c;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }
        .header h1 {
            margin: 0;
            color: #f3c912;
            font-size: 2.5em;
            letter-spacing: 2px;
        }
        .header p {
            color: #aaaaaa;
            font-size: 1.1em;
            margin-top: 5px;
        }
        
        .dashboard {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }
        .card {
            background-color: #1e1e1e;
            border-radius: 12px;
            padding: 20px;
            width: 200px; /* Diperlebar sedikit untuk teks detail */
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border: 1px solid #333;
            display: flex;
            flex-direction: column;
        }
        .timeframe {
            font-size: 1.2em;
            font-weight: 600;
            margin-bottom: 5px;
            color: #cccccc;
        }
        .analysis-detail {
            font-size: 0.75em;
            color: #888888;
            margin-bottom: 15px;
            line-height: 1.3;
            height: 30px; /* Menjaga tinggi agar sejajar */
        }
        .signal {
            font-size: 1.8em;
            font-weight: bold;
            padding: 10px;
            border-radius: 8px;
            transition: all 0.3s ease;
            margin-bottom: 15px;
        }
        .buy {
            background-color: rgba(46, 204, 113, 0.15);
            color: #2ecc71;
            border: 1px solid #2ecc71;
            box-shadow: 0 0 10px rgba(46, 204, 113, 0.2);
        }
        .sell {
            background-color: rgba(231, 76, 60, 0.15);
            color: #e74c3c;
            border: 1px solid #e74c3c;
            box-shadow: 0 0 10px rgba(231, 76, 60, 0.2);
        }
        .loading {
            background-color: rgba(149, 165, 166, 0.15);
            color: #95a5a6;
            border: 1px solid #95a5a6;
            font-size: 1.2em;
        }
        
        /* Styling Progress Bar */
        .card-progress-container {
            width: 100%;
            background-color: #333;
            border-radius: 4px;
            height: 4px;
            overflow: hidden;
            margin-top: auto;
            margin-bottom: 8px;
        }
        .card-progress-bar {
            height: 100%;
            background-color: #f3c912;
            width: 100%;
            transition: width 1s linear;
        }
        .countdown-text {
            font-size: 0.85em;
            color: #aaaaaa;
        }
        
        .footer {
            margin-top: 50px;
            text-align: center;
            font-size: 0.9em;
            color: #777777;
        }
    </style>
</head>
<body>

    <!-- Indikator Koneksi Internet -->
    <div class="network-container">
        <div id="network-status" class="network-status online">Memeriksa koneksi...</div>
    </div>

    <div class="header">
        <h1>XAUUSD MARKET</h1>
        <p>Prediksi Analisa Teknikal Jangka Pendek</p>
    </div>

    <div class="dashboard" id="dashboard">
        <!-- Kartu Timeframe akan di-generate di sini -->
    </div>

    <div class="footer">
        <p>Sinyal disimulasikan secara lokal. Sinyal akan berhenti memperbarui jika koneksi offline.</p>
    </div>

    <script>
        // Deteksi Status Koneksi Internet Real-time
        const networkStatus = document.getElementById('network-status');

        function updateOnlineStatus() {
            if (navigator.onLine) {
                networkStatus.textContent = '🟢 Online (Koneksi Stabil)';
                networkStatus.className = 'network-status online';
            } else {
                networkStatus.textContent = '🔴 Offline (Koneksi Terputus)';
                networkStatus.className = 'network-status offline';
            }
        }

        // Listener untuk memantau perubahan jaringan secara otomatis
        window.addEventListener('online', updateOnlineStatus);
        window.addEventListener('offline', updateOnlineStatus);
        
        // Panggil saat pertama kali dimuat
        updateOnlineStatus();


        // Konfigurasi Timeframe dengan Interval (detik) dan Detail Analisa
        const timeframes = [
            { 
                id: '1m', label: '1 Menit', interval: 10, currentTimer: 10, 
                detail: 'Scalping: Stochastic (5,3,3) & EMA (9)' 
            },
            { 
                id: '5m', label: '5 Menit', interval: 60, currentTimer: 60, 
                detail: 'Momentum: RSI (14) & MACD Crossover' 
            },
            { 
                id: '15m', label: '15 Menit', interval: 120, currentTimer: 120, 
                detail: 'Intraday Trend: Bollinger Bands & EMA (21)' 
            },
            { 
                id: '30m', label: '30 Menit', interval: 180, currentTimer: 180, 
                detail: 'Volume & Trend: VWAP & Parabolic SAR' 
            },
            { 
                id: '1h', label: '1 Jam', interval: 300, currentTimer: 300, 
                detail: 'Swing: Ichimoku Cloud & SMA (50, 200)' 
            }
        ];

        // Format waktu agar lebih mudah dibaca (contoh: 1m 30s)
        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = seconds % 60;
            if (m > 0) {
                return `${m}m ${s}s`;
            }
            return `${s}s`;
        }

        // Inisialisasi tampilan awal UI
        function initDashboard() {
            const dashboard = document.getElementById('dashboard');
            
            timeframes.forEach(tf => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="timeframe">${tf.label}</div>
                    <div class="analysis-detail">${tf.detail}</div>
                    <div class="signal loading" id="signal-${tf.id}">...</div>
                    <div class="card-progress-container">
                        <div class="card-progress-bar" id="progress-${tf.id}"></div>
                    </div>
                    <div class="countdown-text" id="countdown-${tf.id}">Update: ${formatTime(tf.currentTimer)}</div>
                `;
                dashboard.appendChild(card);
                
                // Analisa awal saat web dibuka
                updateSignal(tf);
            });
            
            // Interval berjalan setiap 1 detik
            setInterval(processTimers, 1000);
        }

        // Fungsi Simulasi / Placeholder sinyal BUY/SELL
        function getTechnicalAnalysis(timeframeId) {
            const randomValue = Math.random();
            return randomValue > 0.5 ? 'BUY' : 'SELL';
        }

        // Memperbarui sinyal
        function updateSignal(tf) {
            const signalElement = document.getElementById(`signal-${tf.id}`);
            
            // Jika status sedang offline, jangan perbarui sinyal
            if (!navigator.onLine) {
                signalElement.textContent = 'OFFLINE';
                signalElement.className = 'signal loading';
                return;
            }

            const prediction = getTechnicalAnalysis(tf.id);
            signalElement.textContent = prediction;
            
            // Transisi warna indikator
            if (prediction === 'BUY') {
                signalElement.className = 'signal buy';
            } else {
                signalElement.className = 'signal sell';
            }
        }

        // Proses timer mundur
        function processTimers() {
            // Hentikan proses hitung mundur jika offline
            if (!navigator.onLine) return; 

            timeframes.forEach(tf => {
                tf.currentTimer--;
                
                const progressBar = document.getElementById(`progress-${tf.id}`);
                const countdownText = document.getElementById(`countdown-${tf.id}`);
                
                // Update teks hitung mundur
                countdownText.textContent = `Update: ${formatTime(tf.currentTimer)}`;
                
                // Hitung persentase bar
                const percentage = (tf.currentTimer / tf.interval) * 100;
                progressBar.style.width = percentage + '%';

                // Jika timer habis
                if (tf.currentTimer <= 0) {
                    updateSignal(tf);
                    tf.currentTimer = tf.interval; // Reset interval
                }
            });
        }

        window.onload = initDashboard;
    </script>
</body>
</html>
