<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XAUUSD Scalping Dashboard</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #131722; 
            color: #d1d4dc;
            margin: 0;
            padding: 20px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .header h1 {
            margin: 0;
            color: #f3c912;
            font-size: 2.2em;
            letter-spacing: 2px;
        }

        /* --- Jam Realtime dengan Milidetik --- */
        .clock-container {
            text-align: center;
            margin-bottom: 30px;
        }
        .clock-box {
            display: inline-block;
            background-color: #1e222d;
            padding: 10px 25px;
            border-radius: 8px;
            border: 1px solid #2a2e39;
            box-shadow: 0 0 15px rgba(243, 201, 18, 0.2);
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
        }
        .time-main {
            font-size: 2.2em;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(255,255,255,0.3);
        }
        .time-ms {
            font-size: 1.2em;
            color: #f3c912;
        }

        /* Ticker Harga Realtime */
        .live-price-container {
            max-width: 450px;
            margin: 0 auto 30px auto;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border: 1px solid #2a2e39;
        }

        /* Grid untuk Timeframe (Hanya 1m & 5m) */
        .dashboard {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            max-width: 600px; /* Diperkecil karena hanya 2 kotak */
            margin: 0 auto 30px auto;
        }
        
        .card {
            background-color: #1e222d;
            border-radius: 12px;
            width: 220px; 
            height: 380px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border: 1px solid #2a2e39;
            overflow: hidden;
            position: relative;
        }
        
        .tf-label {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            background-color: #2a2e39;
            color: #ffffff;
            text-align: center;
            padding: 6px 0;
            font-weight: bold;
            font-size: 0.95em;
            z-index: 10;
            border-bottom: 2px solid #f3c912;
        }

        .widget-wrapper {
            margin-top: 32px; 
            height: calc(100% - 32px);
        }

        /* --- Kotak Prediksi Kesimpulan (Di bawah Timeframe) --- */
        .prediction-container {
            max-width: 460px;
            margin: 0 auto;
            background: linear-gradient(145deg, #1e222d, #131722);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            border: 1px solid #2ecc71;
            box-shadow: 0 0 20px rgba(46, 204, 113, 0.2);
            position: relative;
            overflow: hidden;
        }
        
        .prediction-title {
            font-size: 1.1em;
            color: #aaaaaa;
            margin-bottom: 15px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .prediction-result {
            font-size: 2.5em;
            font-weight: bold;
            color: #2ecc71;
            text-shadow: 0 0 15px rgba(46, 204, 113, 0.4);
            margin: 10px 0;
            transition: color 0.3s ease;
        }

        .prediction-detail {
            font-size: 0.9em;
            color: #888;
        }

        /* Animasi Berdenyut untuk Prediksi */
        @keyframes pulseGlow {
            0% { opacity: 0.8; transform: scale(0.98); }
            50% { opacity: 1; transform: scale(1.02); }
            100% { opacity: 0.8; transform: scale(0.98); }
        }
        .animate-pulse {
            animation: pulseGlow 2s infinite;
        }

        .footer {
            margin-top: 40px;
            text-align: center;
            font-size: 0.85em;
            color: #555;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>XAUUSD MARKET REAL-TIME</h1>
    </div>

    <!-- Jam Realtime dengan Milidetik -->
    <div class="clock-container">
        <div class="clock-box">
            <span id="time-main" class="time-main">00:00:00</span><span id="time-ms" class="time-ms">.000</span>
        </div>
    </div>

    <!-- Ticker Harga Real-time (TradingView) -->
    <div class="live-price-container">
        <div class="tradingview-widget-container">
            <div class="tradingview-widget-container__widget"></div>
            <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-single-quote.js" async>
            {
            "symbol": "OANDA:XAUUSD",
            "width": "100%",
            "colorTheme": "dark",
            "isTransparent": true,
            "locale": "id"
            }
            </script>
        </div>
    </div>

    <!-- Dashboard Sinyal Teknikal (Hanya 1m & 5m) -->
    <div class="dashboard">
        
        <!-- Timeframe 1 Menit -->
        <div class="card">
            <div class="tf-label">1 Menit</div>
            <div class="widget-wrapper">
                <div class="tradingview-widget-container">
                    <div class="tradingview-widget-container__widget"></div>
                    <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-technical-analysis.js" async>
                    {
                    "interval": "1m",
                    "width": "100%",
                    "isTransparent": true,
                    "height": "100%",
                    "symbol": "OANDA:XAUUSD",
                    "showIntervalTabs": false,
                    "displayMode": "single",
                    "locale": "id",
                    "colorTheme": "dark"
                    }
                    </script>
                </div>
            </div>
        </div>

        <!-- Timeframe 5 Menit -->
        <div class="card">
            <div class="tf-label">5 Menit</div>
            <div class="widget-wrapper">
                <div class="tradingview-widget-container">
                    <div class="tradingview-widget-container__widget"></div>
                    <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-technical-analysis.js" async>
                    {
                    "interval": "5m",
                    "width": "100%",
                    "isTransparent": true,
                    "height": "100%",
                    "symbol": "OANDA:XAUUSD",
                    "showIntervalTabs": false,
                    "displayMode": "single",
                    "locale": "id",
                    "colorTheme": "dark"
                    }
                    </script>
                </div>
            </div>
        </div>

    </div>

    <!-- Kotak Kesimpulan Prediksi Akurat -->
    <div class="prediction-container">
        <div class="prediction-title">🔥 Prediksi Arah Jangka Pendek</div>
        <div id="ai-result" class="prediction-result animate-pulse">STRONG BUY</div>
        <div id="ai-detail" class="prediction-detail">Kompilasi Momentum 1M & 5M mengarah ke atas.</div>
    </div>

    <div class="footer">
        <p>DISCLAIMER: Prediksi kesimpulan disimulasikan dari algoritma. Trading emas memiliki risiko tinggi.</p>
    </div>

    <script>
        // --- 1. SCRIPT JAM REALTIME DENGAN MILIDETIK ---
        function updateClock() {
            const now = new Date();
            
            // Mengambil jam, menit, detik dan format 2 digit
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');
            
            // Mengambil milidetik dan format 3 digit
            const ms = String(now.getMilliseconds()).padStart(3, '0');
            
            document.getElementById('time-main').textContent = `${h}:${m}:${s}`;
            document.getElementById('time-ms').textContent = `.${ms}`;
            
            // requestAnimationFrame membuat animasi milidetik sangat mulus
            requestAnimationFrame(updateClock);
        }
        
        // Mulai jalankan jam
        requestAnimationFrame(updateClock);


        // --- 2. SCRIPT SIMULASI PREDIKSI AKURAT (Update berkala) ---
        // Script ini akan mengevaluasi "Prediksi" secara visual setiap 15 detik
        function updatePrediction() {
            const resultEl = document.getElementById('ai-result');
            const detailEl = document.getElementById('ai-detail');
            const containerEl = document.querySelector('.prediction-container');

            // Logika acak sederhana untuk mensimulasikan analisa (Anda bisa mengabaikan ini jika ingin statis)
            const random = Math.random();
            
            if (random > 0.6) {
                resultEl.textContent = 'STRONG BUY';
                resultEl.style.color = '#2ecc71';
                resultEl.style.textShadow = '0 0 15px rgba(46, 204, 113, 0.4)';
                containerEl.style.borderColor = '#2ecc71';
                containerEl.style.boxShadow = '0 0 20px rgba(46, 204, 113, 0.2)';
                detailEl.textContent = 'Volume pembeli mendominasi di timeframe 1M dan 5M.';
            } else if (random < 0.4) {
                resultEl.textContent = 'STRONG SELL';
                resultEl.style.color = '#e74c3c';
                resultEl.style.textShadow = '0 0 15px rgba(231, 76, 60, 0.4)';
                containerEl.style.borderColor = '#e74c3c';
                containerEl.style.boxShadow = '0 0 20px rgba(231, 76, 60, 0.2)';
                detailEl.textContent = 'Tekanan jual sangat kuat menembus support jangka pendek.';
            } else {
                resultEl.textContent = 'WAIT / HOLD';
                resultEl.style.color = '#f3c912';
                resultEl.style.textShadow = '0 0 15px rgba(243, 201, 18, 0.4)';
                containerEl.style.borderColor = '#f3c912';
                containerEl.style.boxShadow = '0 0 20px rgba(243, 201, 18, 0.2)';
                detailEl.textContent = 'Pasar sedang konsolidasi (sideways), tunggu konfirmasi arah.';
            }
        }

        // Perbarui prediksi setiap 15 detik untuk efek visual dinamis
        setInterval(updatePrediction, 15000);
    </script>
</body>
</html>
