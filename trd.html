<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XAUUSD Live TradingView Dashboard</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #131722; 
            color: #d1d4dc;
            margin: 0;
            padding: 20px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header h1 {
            margin: 0;
            color: #f3c912;
            font-size: 2.2em;
            letter-spacing: 2px;
        }
        .header p {
            color: #8a93a6;
            font-size: 1em;
            margin-top: 5px;
        }

        /* Ticker Harga Realtime */
        .live-price-container {
            max-width: 450px;
            margin: 0 auto 30px auto;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border: 1px solid #2a2e39;
        }

        /* Grid untuk 4 Timeframe */
        .dashboard {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px; /* Jarak antar kotak sedikit dirapatkan */
            max-width: 1000px;
            margin: 0 auto;
        }
        
        /* Ukuran Kotak yang Diperkecil */
        .card {
            background-color: #1e222d;
            border-radius: 12px;
            width: 220px; /* Diperkecil dari 280px */
            height: 380px; /* Diperkecil dari 420px */
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border: 1px solid #2a2e39;
            overflow: hidden;
            position: relative;
        }
        
        /* Label khusus di atas widget */
        .tf-label {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            background-color: #2a2e39;
            color: #ffffff;
            text-align: center;
            padding: 6px 0;
            font-weight: bold;
            font-size: 0.95em; /* Font disesuaikan */
            z-index: 10;
            border-bottom: 2px solid #f3c912;
        }

        /* Ruang agar widget tidak tertutup label */
        .widget-wrapper {
            margin-top: 32px; 
            height: calc(100% - 32px);
        }

        .footer {
            margin-top: 50px;
            text-align: center;
            font-size: 0.85em;
            color: #787b86;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>XAUUSD MARKET REAL-TIME</h1>
        <p>Data Resmi didukung oleh TradingView</p>
    </div>

    <!-- Ticker Harga Real-time (Widget TradingView) -->
    <div class="live-price-container">
        <!-- TradingView Widget BEGIN -->
        <div class="tradingview-widget-container">
            <div class="tradingview-widget-container__widget"></div>
            <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-single-quote.js" async>
            {
            "symbol": "OANDA:XAUUSD",
            "width": "100%",
            "colorTheme": "dark",
            "isTransparent": true,
            "locale": "id"
            }
            </script>
        </div>
        <!-- TradingView Widget END -->
    </div>

    <!-- Dashboard Sinyal Teknikal (4 Timeframe) -->
    <div class="dashboard" id="dashboard">
        
        <!-- Timeframe 1 Menit -->
        <div class="card">
            <div class="tf-label">1 Menit</div>
            <div class="widget-wrapper">
                <div class="tradingview-widget-container">
                    <div class="tradingview-widget-container__widget"></div>
                    <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-technical-analysis.js" async>
                    {
                    "interval": "1m",
                    "width": "100%",
                    "isTransparent": true,
                    "height": "100%",
                    "symbol": "OANDA:XAUUSD",
                    "showIntervalTabs": false,
                    "displayMode": "single",
                    "locale": "id",
                    "colorTheme": "dark"
                    }
                    </script>
                </div>
            </div>
        </div>

        <!-- Timeframe 5 Menit -->
        <div class="card">
            <div class="tf-label">5 Menit</div>
            <div class="widget-wrapper">
                <div class="tradingview-widget-container">
                    <div class="tradingview-widget-container__widget"></div>
                    <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-technical-analysis.js" async>
                    {
                    "interval": "5m",
                    "width": "100%",
                    "isTransparent": true,
                    "height": "100%",
                    "symbol": "OANDA:XAUUSD",
                    "showIntervalTabs": false,
                    "displayMode": "single",
                    "locale": "id",
                    "colorTheme": "dark"
                    }
                    </script>
                </div>
            </div>
        </div>

        <!-- Timeframe 15 Menit -->
        <div class="card">
            <div class="tf-label">15 Menit</div>
            <div class="widget-wrapper">
                <div class="tradingview-widget-container">
                    <div class="tradingview-widget-container__widget"></div>
                    <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-technical-analysis.js" async>
                    {
                    "interval": "15m",
                    "width": "100%",
                    "isTransparent": true,
                    "height": "100%",
                    "symbol": "OANDA:XAUUSD",
                    "showIntervalTabs": false,
                    "displayMode": "single",
                    "locale": "id",
                    "colorTheme": "dark"
                    }
                    </script>
                </div>
            </div>
        </div>

        <!-- Timeframe 30 Menit -->
        <div class="card">
            <div class="tf-label">30 Menit</div>
            <div class="widget-wrapper">
                <div class="tradingview-widget-container">
                    <div class="tradingview-widget-container__widget"></div>
                    <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-technical-analysis.js" async>
                    {
                    "interval": "30m",
                    "width": "100%",
                    "isTransparent": true,
                    "height": "100%",
                    "symbol": "OANDA:XAUUSD",
                    "showIntervalTabs": false,
                    "displayMode": "single",
                    "locale": "id",
                    "colorTheme": "dark"
                    }
                    </script>
                </div>
            </div>
        </div>

    </div>

    <div class="footer">
        <p>Data harga dan indikator teknikal (Buy/Sell) didukung penuh oleh algoritma real-time TradingView.</p>
    </div>

</body>
</html>
