<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XAUUSD Prediksi Trading Realtime</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 40px 20px;
        }
        .header {
            text-align: center;
            margin-bottom: 40px;
        }
        .header h1 {
            margin: 0;
            color: #f3c912;
            font-size: 2.5em;
            letter-spacing: 2px;
        }
        .header p {
            color: #aaaaaa;
            font-size: 1.1em;
        }
        .dashboard {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }
        .card {
            background-color: #1e1e1e;
            border-radius: 12px;
            padding: 25px 20px;
            width: 170px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border: 1px solid #333;
            display: flex;
            flex-direction: column;
        }
        .timeframe {
            font-size: 1.2em;
            font-weight: 600;
            margin-bottom: 15px;
            color: #cccccc;
        }
        .signal {
            font-size: 1.8em;
            font-weight: bold;
            padding: 10px;
            border-radius: 8px;
            transition: all 0.3s ease;
            margin-bottom: 15px;
        }
        .buy {
            background-color: rgba(46, 204, 113, 0.15);
            color: #2ecc71;
            border: 1px solid #2ecc71;
            box-shadow: 0 0 10px rgba(46, 204, 113, 0.2);
        }
        .sell {
            background-color: rgba(231, 76, 60, 0.15);
            color: #e74c3c;
            border: 1px solid #e74c3c;
            box-shadow: 0 0 10px rgba(231, 76, 60, 0.2);
        }
        .loading {
            background-color: rgba(149, 165, 166, 0.15);
            color: #95a5a6;
            border: 1px solid #95a5a6;
            font-size: 1.2em;
        }
        
        /* Styling untuk progress bar per card */
        .card-progress-container {
            width: 100%;
            background-color: #333;
            border-radius: 4px;
            height: 4px;
            overflow: hidden;
            margin-top: auto;
            margin-bottom: 8px;
        }
        .card-progress-bar {
            height: 100%;
            background-color: #f3c912;
            width: 100%;
            transition: width 1s linear;
        }
        .countdown-text {
            font-size: 0.85em;
            color: #888;
        }
        
        .footer {
            margin-top: 50px;
            text-align: center;
            font-size: 0.9em;
            color: #777777;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>XAUUSD MARKET</h1>
        <p>Prediksi Analisa Teknikal Jangka Pendek</p>
    </div>

    <div class="dashboard" id="dashboard">
        <!-- Kartu Timeframe akan di-generate oleh JavaScript -->
    </div>

    <div class="footer">
        <p>Sinyal akan diperbarui secara otomatis sesuai jadwal masing-masing timeframe.</p>
    </div>

    <script>
        // Konfigurasi Timeframe dengan interval masing-masing (dalam hitungan detik)
        const timeframes = [
            { id: '1m', label: '1 Menit', interval: 10, currentTimer: 10 },        // Update per 10 detik
            { id: '5m', label: '5 Menit', interval: 60, currentTimer: 60 },        // Update per 1 menit
            { id: '15m', label: '15 Menit', interval: 120, currentTimer: 120 },    // Update per 2 menit
            { id: '30m', label: '30 Menit', interval: 180, currentTimer: 180 },    // Update per 3 menit
            { id: '1h', label: '1 Jam', interval: 300, currentTimer: 300 }         // Update per 5 menit
        ];

        // Format waktu agar lebih mudah dibaca (contoh: 1m 30s)
        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = seconds % 60;
            if (m > 0) {
                return `${m}m ${s}s`;
            }
            return `${s}s`;
        }

        // Inisialisasi tampilan awal UI
        function initDashboard() {
            const dashboard = document.getElementById('dashboard');
            
            timeframes.forEach(tf => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="timeframe">${tf.label}</div>
                    <div class="signal loading" id="signal-${tf.id}">...</div>
                    <div class="card-progress-container">
                        <div class="card-progress-bar" id="progress-${tf.id}"></div>
                    </div>
                    <div class="countdown-text" id="countdown-${tf.id}">Update: ${formatTime(tf.currentTimer)}</div>
                `;
                dashboard.appendChild(card);
                
                // Panggil analisa pertama kali secara instan saat web dibuka
                updateSignal(tf);
            });
            
            // Set interval master per 1 detik untuk menjalankan semua timer
            setInterval(processTimers, 1000);
        }

        // Fungsi Simulasi / Placeholder untuk mendapatkan sinyal BUY atau SELL
        function getTechnicalAnalysis(timeframeId) {
            // Simulasi pergerakan acak
            const randomValue = Math.random();
            return randomValue > 0.5 ? 'BUY' : 'SELL';
        }

        // Memperbarui sinyal hanya untuk timeframe tertentu
        function updateSignal(tf) {
            const signalElement = document.getElementById(`signal-${tf.id}`);
            const prediction = getTechnicalAnalysis(tf.id);
            
            signalElement.textContent = prediction;
            
            // Animasi transisi warna
            if (prediction === 'BUY') {
                signalElement.className = 'signal buy';
            } else {
                signalElement.className = 'signal sell';
            }
        }

        // Loop utama yang berjalan setiap detik
        function processTimers() {
            timeframes.forEach(tf => {
                tf.currentTimer--;
                
                // Ambil elemen HTML
                const progressBar = document.getElementById(`progress-${tf.id}`);
                const countdownText = document.getElementById(`countdown-${tf.id}`);
                
                // Update teks hitung mundur
                countdownText.textContent = `Update: ${formatTime(tf.currentTimer)}`;
                
                // Hitung persentase bar
                const percentage = (tf.currentTimer / tf.interval) * 100;
                progressBar.style.width = percentage + '%';

                // Jika timer habis, update sinyal lalu reset timer
                if (tf.currentTimer <= 0) {
                    updateSignal(tf);
                    tf.currentTimer = tf.interval; // Reset kembali ke interval awal
                }
            });
        }

        // Jalankan script setelah seluruh elemen halaman termuat
        window.onload = initDashboard;
    </script>
</body>
</html>
