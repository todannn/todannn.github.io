<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XAUUSD Scalping Dashboard</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #131722; 
            color: #d1d4dc;
            margin: 0;
            padding: 20px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .header h1 {
            margin: 0;
            color: #f3c912;
            font-size: 2.2em;
            letter-spacing: 2px;
        }

        /* --- Wrapper untuk Jam dan Ping --- */
        .top-info-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        /* --- Jam Realtime dengan Milidetik --- */
        .clock-box {
            background-color: #1e222d;
            padding: 10px 20px;
            border-radius: 8px;
            border: 1px solid #2a2e39;
            box-shadow: 0 0 15px rgba(243, 201, 18, 0.15);
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
        }
        .time-main {
            font-size: 2em;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(255,255,255,0.3);
        }
        .time-ms {
            font-size: 1.1em;
            color: #f3c912;
        }

        /* --- Indikator Ping --- */
        .ping-box {
            background-color: #1e222d;
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid #2a2e39;
            font-size: 1em;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
            height: 32px; 
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
        }
        .ping-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: #787b86; 
            transition: all 0.3s ease;
        }
        
        .ping-good { color: #2ecc71; border-color: rgba(46, 204, 113, 0.4); }
        .ping-good .ping-dot { background-color: #2ecc71; box-shadow: 0 0 10px #2ecc71; }
        
        .ping-fair { color: #f3c912; border-color: rgba(243, 201, 18, 0.4); }
        .ping-fair .ping-dot { background-color: #f3c912; box-shadow: 0 0 10px #f3c912; }
        
        .ping-poor { color: #e74c3c; border-color: rgba(231, 76, 60, 0.4); }
        .ping-poor .ping-dot { background-color: #e74c3c; box-shadow: 0 0 10px #e74c3c; }


        /* Ticker Harga Realtime */
        .live-price-container {
            max-width: 500px; 
            margin: 0 auto 30px auto;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border: 1px solid #2a2e39;
        }

        /* --- Kotak Prediksi Utama (Glow) --- */
        .prediction-container {
            max-width: 500px;
            margin: 0 auto 15px auto; /* Margin diperkecil karena box alasan ada di bawahnya */
            background: linear-gradient(145deg, #1e222d, #131722);
            border-radius: 12px;
            padding: 25px;
            text-align: center;
            border: 1px solid #2ecc71;
            box-shadow: 0 0 20px rgba(46, 204, 113, 0.2);
            position: relative;
            overflow: hidden;
            box-sizing: border-box;
            transition: all 0.4s ease;
        }
        
        .prediction-title {
            font-size: 1.1em;
            color: #aaaaaa;
            margin-bottom: 5px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .prediction-result {
            font-size: 2.8em;
            font-weight: bold;
            color: #2ecc71;
            text-shadow: 0 0 15px rgba(46, 204, 113, 0.4);
            margin: 10px 0 0 0; /* Hapus margin bawah */
            transition: color 0.3s ease;
        }

        @keyframes pulseGlow {
            0% { opacity: 0.85; transform: scale(0.99); }
            50% { opacity: 1; transform: scale(1.01); }
            100% { opacity: 0.85; transform: scale(0.99); }
        }
        .animate-pulse {
            animation: pulseGlow 2.5s infinite;
        }

        /* --- Kotak Alasan Detail (Eksternal) --- */
        .reasoning-container {
            max-width: 500px;
            margin: 0 auto 40px auto;
        }

        .reasoning-box {
            background-color: #1e222d;
            border-radius: 12px;
            padding: 20px;
            text-align: left;
            font-size: 0.95em;
            line-height: 1.6;
            color: #d1d4dc;
            border: 1px solid #2a2e39;
            border-left: 5px solid #2ecc71; /* Garis warna dinamis */
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
        }

        .reasoning-box strong {
            color: #ffffff;
            font-size: 1.05em;
            letter-spacing: 0.5px;
            display: inline-block;
            margin-bottom: 8px;
        }

        .footer {
            text-align: center;
            font-size: 0.85em;
            color: #555;
            padding-bottom: 30px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>XAUUSD MARKET REAL-TIME</h1>
    </div>

    <!-- Bagian Atas: Jam dan Ping Internet -->
    <div class="top-info-wrapper">
        <!-- Jam -->
        <div class="clock-box">
            <span id="time-main" class="time-main">00:00:00</span><span id="time-ms" class="time-ms">.000</span>
        </div>
        
        <!-- Ping -->
        <div class="ping-box" id="ping-box">
            <div class="ping-dot"></div>
            <span id="ping-value">Ping: -- ms</span>
        </div>
    </div>

    <!-- Ticker Harga Real-time (TradingView) -->
    <div class="live-price-container">
        <div class="tradingview-widget-container">
            <div class="tradingview-widget-container__widget"></div>
            <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-single-quote.js" async>
            {
            "symbol": "OANDA:XAUUSD",
            "width": "100%",
            "colorTheme": "dark",
            "isTransparent": true,
            "locale": "id"
            }
            </script>
        </div>
    </div>

    <!-- Kotak Kesimpulan Prediksi Akurat -->
    <div class="prediction-container animate-pulse" id="prediction-container">
        <div class="prediction-title">🔥 Analisa Jangka Pendek Saat Ini</div>
        <div id="ai-result" class="prediction-result">STRONG BUY</div>
    </div>

    <!-- Kotak Alasan Detail (Sekarang terpisah di bawah) -->
    <div class="reasoning-container">
        <div class="reasoning-box" id="ai-reasoning">
            <strong>Analisa Teknikal:</strong><br>
            Menunggu sinkronisasi data pasar...
        </div>
    </div>

    <div class="footer">
        <p>DISCLAIMER: Prediksi kesimpulan disimulasikan dari algoritma. Trading emas memiliki risiko tinggi.</p>
    </div>

    <script>
        // --- 1. SCRIPT JAM REALTIME DENGAN MILIDETIK ---
        function updateClock() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');
            const ms = String(now.getMilliseconds()).padStart(3, '0');
            
            document.getElementById('time-main').textContent = `${h}:${m}:${s}`;
            document.getElementById('time-ms').textContent = `.${ms}`;
            
            requestAnimationFrame(updateClock);
        }
        requestAnimationFrame(updateClock);


        // --- 2. SCRIPT PING KONEKSI INTERNET ---
        function checkPing() {
            const pingBox = document.getElementById('ping-box');
            const pingValue = document.getElementById('ping-value');

            if (!navigator.onLine) {
                pingValue.textContent = 'Offline';
                pingBox.className = 'ping-box ping-poor';
                return;
            }

            const startTime = performance.now();
            const img = new Image();
            
            img.onload = img.onerror = function() {
                const endTime = performance.now();
                const pingTime = Math.round(endTime - startTime);
                
                pingValue.textContent = `${pingTime} ms`;
                
                if (pingTime < 100) {
                    pingBox.className = 'ping-box ping-good'; 
                } else if (pingTime < 250) {
                    pingBox.className = 'ping-box ping-fair'; 
                } else {
                    pingBox.className = 'ping-box ping-poor'; 
                }
            };
            
            img.src = "https://www.google.com/favicon.ico?r=" + new Date().getTime();
        }

        checkPing();
        setInterval(checkPing, 2000);


        // --- 3. SCRIPT SIMULASI PREDIKSI AKURAT DENGAN ALASAN DETAIL ---
        function updatePrediction() {
            const resultEl = document.getElementById('ai-result');
            const reasonEl = document.getElementById('ai-reasoning');
            const containerEl = document.getElementById('prediction-container');

            // Acak hasil (hanya untuk simulasi logika)
            const random = Math.random();
            
            if (random > 0.6) {
                // Skenario BUY
                resultEl.textContent = 'STRONG BUY';
                resultEl.style.color = '#2ecc71';
                resultEl.style.textShadow = '0 0 15px rgba(46, 204, 113, 0.4)';
                
                containerEl.style.borderColor = '#2ecc71';
                containerEl.style.boxShadow = '0 0 20px rgba(46, 204, 113, 0.15)';
                
                reasonEl.style.borderLeftColor = '#2ecc71';
                reasonEl.innerHTML = "<strong>Alasan Detail:</strong><br>Harga berhasil menembus area <em>resistance</em> dinamis (EMA 20 & 50) dengan lonjakan volume beli yang signifikan. Indikator MACD mencetak histogram hijau yang membesar, menandakan momentum <em>bullish</em> yang sangat kuat. Struktur pasar jangka pendek membentuk pola 'Higher High', membuka potensi profitabilitas pada arah kenaikan (long).";
                
            } else if (random < 0.4) {
                // Skenario SELL
                resultEl.textContent = 'STRONG SELL';
                resultEl.style.color = '#e74c3c';
                resultEl.style.textShadow = '0 0 15px rgba(231, 76, 60, 0.4)';
                
                containerEl.style.borderColor = '#e74c3c';
                containerEl.style.boxShadow = '0 0 20px rgba(231, 76, 60, 0.15)';
                
                reasonEl.style.borderLeftColor = '#e74c3c';
                reasonEl.innerHTML = "<strong>Alasan Detail:</strong><br>Terjadi penolakan (<em>rejection</em>) yang keras pada level <em>supply</em> utama, diikuti oleh penutupan <em>candlestick bearish engulfing</em> beruntun. RSI (Relative Strength Index) bergerak turun tajam dan menembus level tengah. Garis tren support telah dipatahkan, sehingga tekanan jual mendominasi penuh pasar saat ini.";
                
            } else {
                // Skenario WAIT
                resultEl.textContent = 'WAIT / HOLD';
                resultEl.style.color = '#f3c912';
                resultEl.style.textShadow = '0 0 15px rgba(243, 201, 18, 0.4)';
                
                containerEl.style.borderColor = '#f3c912';
                containerEl.style.boxShadow = '0 0 20px rgba(243, 201, 18, 0.15)';
                
                reasonEl.style.borderLeftColor = '#f3c912';
                reasonEl.innerHTML = "<strong>Alasan Detail:</strong><br>Pergerakan harga saat ini tertahan di dalam fase konsolidasi (<em>sideways</em>). Tidak terlihat dominasi yang jelas antara kekuatan beli (buyer) maupun jual (seller) karena harga hanya berfluktuasi tipis di zona sempit. Sangat disarankan untuk menghindari <em>entry</em> dan menunggu konfirmasi <em>breakout</em> yang valid ke salah satu arah untuk meminimalisir risiko.";
            }
        }
        
        // Panggil langsung saat pertama kali dibuka, lalu ulangi setiap 15 detik
        updatePrediction();
        setInterval(updatePrediction, 15000);
    </script>
</body>
</html>
